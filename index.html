<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<meta name="description" content="Replacez cinq événements tirés de Wikipédia dans l’ordre chronologique." />
<title>Wiki Timeline</title>

<!-- Thème appliqué AVANT le CSS : pas de flash clair/sombre (clé "theme", sinon préférence système) -->
<script>
  (function () {
    var t = "light";
    try {
      t = localStorage.getItem("theme") ||
          (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    } catch (e) {}
    document.documentElement.dataset.theme = t;
    document.documentElement.style.colorScheme = t;
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://fr.wikipedia.org" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">

  <header class="top">
    <div class="brand"><span class="brand__mark" aria-hidden="true">W</span>Wiki Timeline</div>
    <div class="top__right">
      <div class="mode">
        <label class="sr-only" for="modeSelect">Difficulté</label>
        <select id="modeSelect" class="select" title="Facile : pages très célèbres · Difficile : aucun filtre">
          <option value="easy">Facile</option>
          <option value="normal">Normal</option>
          <option value="hard">Difficile</option>
        </select>
      </div>
      <div class="stats" role="group" aria-label="Statistiques">
        <div class="stat" id="stat-streak"><span class="stat__v" id="s-streak">0</span><span class="stat__l">Série</span></div>
        <div class="stat"><span class="stat__v" id="s-best">0</span><span class="stat__l">Record</span></div>
        <div class="stat"><span class="stat__v" id="s-perfect">0/0</span><span class="stat__l">Parfaites</span></div>
      </div>
      <button id="themeToggle" class="icon-btn" type="button" aria-label="Changer de thème"></button>
    </div>
  </header>

  <section class="ask">
    <h1>Replace ces événements dans l’<em>ordre chronologique</em></h1>
  </section>

  <main>
    <p id="help" class="sr-only">
      Glissez une carte par sa poignée, ou utilisez les flèches haut et bas pour la déplacer.
      Du plus ancien en haut au plus récent en bas.
    </p>
    <div class="board-wrap">
      <div class="rail" id="rail" aria-hidden="true"></div>
      <div id="board" role="list" aria-label="Événements à ordonner"></div>
    </div>
  </main>

  <div class="actions">
    <div class="status" id="status" data-state="loading" role="status" aria-live="polite">Chargement…</div>
    <div class="actions__btns">
      <button id="validateBtn" class="btn" type="button" disabled>Valider</button>
      <button id="newGameBtn" class="btn btn--ghost" type="button" disabled>Nouvelle partie</button>
    </div>
  </div>

  <footer class="foot">
    Événements : <a href="https://fr.wikipedia.org" target="_blank" rel="noopener noreferrer">Wikipédia</a> (CC BY-SA)
  </footer>
</div>

<noscript><p style="text-align:center;padding:24px">Ce jeu nécessite JavaScript.</p></noscript>
<script src="script.js"></script>
</body>
</html>
