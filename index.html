<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wiki Timeline — Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <header class="header">
    <div class="header-left">
      <h1>Wiki Timeline</h1>
      <p>Replacez les événements dans l'ordre chronologique.</p>
    </div>
    <div class="header-right">
      <div class="status" id="status">Prêt</div>
      
      <!-- LE MENU DÉROULANT EST ICI -->
      <select id="modeSelect" class="btn" style="padding: 8px; cursor: pointer; font-family: inherit; font-size: 0.875rem;">
        <option value="normal">Normal</option>
        <option value="hard">Difficile</option>
      </select>

      <button id="validateBtn" class="btn" disabled>Valider</button>
      <button id="newGameBtn" class="btn btn-primary">Nouvelle partie</button>
      <button id="themeToggle" class="btn btn-icon">🌙</button>
    </div>
  </header>

  <div class="board-wrap">
    <div class="rail" id="rail"></div>
    <div id="board"></div>
  </div>

  <div class="result" id="result"></div>
</div>

<script src="script.js"></script>
</body>
</html>
